[package]
name = "zeus-core-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "UniFFI bridge exposing the Zeus core to the iOS app. The gateway runs on the phone."

# Standalone: this crate is NOT part of mikehash/Zeus's workspace. It pins that
# workspace by sha and links it as a git dependency, so an empty [workspace]
# table is required or cargo walks up and finds zeus-ios (which has none) or,
# worse, an ambient one outside the repo.
[workspace]

[lib]
name = "zeus_core_bridge"
# staticlib for the xcframework; cdylib is deliberately absent (iOS app targets
# link the static archive, and a second crate-type doubles link time for nothing).
crate-type = ["staticlib", "lib"]

[dependencies]
# --- pinned to mikehash/Zeus @ 2bfc08aa11148012fc5aa5db92fea6a88c11d599 ---------------------------------------
# Re-pinned from 2a2168cd (an ancestor of this sha; `merge-base --is-ancestor`
# rc=0, so this is a forward move, not a fork). 213d4e7c is the commit that
# feature-gates zeus-talos behind `automation` — the gate this bridge needs in
# order to take zeus-agent at all. Every crate below rides the SAME sha: a
# git dependency resolves per-rev, and two revs of one repo in one lock file is
# two copies of every shared type. zeus-mnemosyne is
# deliberately ABSENT: it pulls rusqlite `bundled`, a C sqlite amalgamation that
# has never been cross-compiled against the iOS SDK here. Unmeasured C build !=
# dependency of the first phone build. (Ruled by Zeus100, 2026-09-07.)
zeus-core = { git = "https://github.com/mikehash/Zeus", rev = "2bfc08aa11148012fc5aa5db92fea6a88c11d599" }
zeus-llm = { git = "https://github.com/mikehash/Zeus", rev = "2bfc08aa11148012fc5aa5db92fea6a88c11d599" }
zeus-session = { git = "https://github.com/mikehash/Zeus", rev = "2bfc08aa11148012fc5aa5db92fea6a88c11d599" }
zeus-memory = { git = "https://github.com/mikehash/Zeus", rev = "2bfc08aa11148012fc5aa5db92fea6a88c11d599" }
# zeus-agent at the same pin, default-features = false: its default set is
# ["audio","matrix","voice","automation"] (2bfc08aa11148012fc5aa5db92fea6a88c11d599 crates/zeus-agent/Cargo.toml:10)
# and all four are host-surface — `automation` is the only gate on zeus-talos.
zeus-agent = { git = "https://github.com/mikehash/Zeus", rev = "2bfc08aa11148012fc5aa5db92fea6a88c11d599", default-features = false }

# FULL 40-char revs above, not abbreviations, and the reason is portability not
# style: mikehash/Zeus carries BOTH `refs/heads/TUI` and
# `refs/heads/tui/track-a-chrome` (measured with git ls-remote). On a
# case-insensitive filesystem — every default macOS box — the loose-ref forms
# collide: `tui` cannot be created as a directory while `TUI` exists as a file.
# libgit2 reports the failure as "failed to authenticate when downloading
# repository"; the git CLI backend reports the true cause. Neither can fetch.
# A full sha lets cargo resolve against an already-present object and skip the
# fetch. A fresh box must seed ~/.cargo/git/db/zeus-<hash> from a local clone
# (`git clone --bare ~/Zeus <db>` then `git pack-refs --all` — packed refs are
# one file, so the two names coexist). The remote-side rename is the real fix.

# uniffi 0.28 is INHERITED, not chosen: it already sits at the pin's workspace
# Cargo.toml:243 with 0 of 39 manifests consuming it (measured with a quoted
# git grep + a tokio 38/39 positive control). This bridge is its first consumer.
uniffi = { version = "0.28", features = ["cli"] }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "fs"] }
anyhow = "1"
thiserror = "2"
chrono = "0.4"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
