name: Zeus
options:
  bundleIdPrefix: com.zeus
  deploymentTarget:
    iOS: "17.0"
targets:
  Zeus:
    type: application
    platform: iOS
    sources: [Sources/ZeusApp]
    info:
      path: Sources/ZeusApp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Zeus
  ZeusTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/ZeusTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Zeus
schemes:
  Zeus:
    build:
      targets:
        Zeus: all
        ZeusTests: [test]
    test:
      targets: [ZeusTests]
