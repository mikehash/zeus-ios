name: Zeus
options:
  bundleIdPrefix: com.zeus
  deploymentTarget:
    iOS: "17.0"
targets:
  Zeus:
    type: application
    platform: iOS
    sources: [Sources/ZeusApp]
    settings:
      base:
        # NAMES THE ICON SET, AND IT IS NAMED HERE BECAUSE THE OTHER PLACE IT
        # LIVED WAS NOT A DECISION. `xcodegen` emits this key with the value
        # `AppIcon` by DEFAULT, into `Zeus.xcodeproj/project.pbxproj` — which
        # `.gitignore` excludes. So before this line, the only thing pointing
        # at the icon was a generated file nobody chose, nobody could review,
        # and that was rewritten on every `xcodegen generate`. A default
        # wearing a decision's clothes. Stating it here makes it tracked
        # config, reviewable in a diff, and identical in meaning.
        #
        # The value is UNCHANGED from what xcodegen already emitted — this
        # commit does not alter the build, it makes the setting auditable.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPHONE ONLY, AND IT IS STATED HERE FOR THE SAME REASON AS THE LINE
        # ABOVE. xcodegen defaults this to "1,2" — iPhone AND iPad — into the
        # untracked pbxproj, so before this line the app CLAIMED iPad and
        # nobody had chosen that. Measured at baf0e1d: `UIScreen`,
        # `horizontalSizeClass` and `idiom` are 0 hits across Sources. Nothing
        # in this app has ever considered a large canvas, and claiming iPad
        # also makes iPad screenshots MANDATORY in App Store Connect — it
        # doubles the capture set for a form factor never rendered.
        #
        # "1" is honest about what was built. It is one line to reverse the
        # day someone lays out a split view. iPad remains a product question
        # for merakizzz; this is the default until he answers.
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      # POINTS AT a tracked, hand-written file — it is deliberately NOT an
      # inline `properties:` block. An inline block would make xcodegen
      # generate the entitlements file too, and the reasoning about what
      # `development` does and does not buy would be destroyed by the next
      # `xcodegen generate` exactly as the Info.plist comment is.
      path: Sources/ZeusApp/Zeus.entitlements
    info:
      # AUTHORITATIVE SOURCE for Sources/ZeusApp/Info.plist. That file is
      # generated whole from the properties below on every `xcodegen
      # generate`; edits made directly to the plist are discarded. Add keys
      # here, never there.
      path: Sources/ZeusApp/Info.plist
      properties:
        # `UILaunchScreen: {}` IS VALID AND IT IS THE BUG. An empty dictionary
        # is a well-formed launch screen — it renders the SYSTEM DEFAULT
        # background, which is WHITE in light mode, in front of an app whose
        # `bg` is 0x0D0806. Near-black app, white flash, every cold start, and
        # nothing anywhere reports it: no warning, no failing test, no lint.
        # `UIColorName` points at a tracked colour resource in the catalog, so
        # the launch background and `Theme.bg` are now the same three bytes
        # from the same tree.
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleDisplayName: Zeus
        # PORTRAIT ONLY, AND THE APP HAS NEVER SAID OTHERWISE IN CODE.
        # Measured at cc494a5: `orientation` is 0 hits across Sources and
        # Tests (POS ctl `AgentState` 8 on the same corpus, so the zero has a
        # reporter). Nothing reads it, nothing adapts to it, and no view was
        # ever laid out against a landscape canvas. Absent this key the OS
        # supplies its own default — portrait plus BOTH landscapes on iPhone —
        # so the app currently rotates into two geometries nobody designed and
        # no leg in this suite can observe. Same organ as the icon name and the
        # device family: the behaviour was a default nobody chose.
        #
        # This is a product statement, not a defect fix. It is one line to
        # widen the day a landscape layout exists.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # THE FLOOR ON WHAT HARDWARE MAY INSTALL THIS. `arm64` excludes the
        # 32-bit devices that cannot run an iOS 17 deployment target anyway —
        # it is redundant with `deploymentTarget` TODAY and it is stated so the
        # requirement is tracked rather than inferred from a number elsewhere.
        # Deliberately NOT listing capabilities the app merely uses well
        # (camera, telephony): every entry here REMOVES devices from the store
        # listing, and a capability claimed but not required is a silent
        # narrowing of the install base with no reporter.
        UIRequiredDeviceCapabilities:
          - arm64
        # EXPORT COMPLIANCE, AND IT IS AN ASSUMPTION UNTIL merakizzz CONFIRMS.
        # Without this key App Store Connect blocks EVERY upload on an
        # interactive prompt — the declaration is the only thing that makes a
        # submission non-interactive. `false` asserts the app uses no
        # non-exempt encryption.
        #
        # WHAT IS MEASURED vs WHAT IS DECLARED, because they are not the same:
        # measured at cc494a5, `CryptoKit`, `CommonCrypto`, `SecKey` and
        # `CC_SHA` are 0 files across Sources and Tests — the app ships no
        # custom crypto and speaks HTTPS to its own gateway, which is the
        # exempt case. But export compliance is a LEGAL declaration about a
        # shipped binary, not a grep result, and a green census is not
        # authority to make one. The measurement supports the answer; it does
        # not constitute it. Confirmation is item 3 on
        # docs/STORE-UPLOAD-CHECKLIST.md and it gates upload, not this commit.
        ITSAppUsesNonExemptEncryption: false
        # WITHOUT THIS, `onOpenURL` NEVER FIRES. The parser and its tests are
        # pure Swift and pass whether or not the app is registered for the
        # scheme — so a green suite is not evidence the links work. This block
        # is the only thing that makes the OS route `zeus://` here, and it is
        # tracked config, so it cannot drift out with a stale pbxproj.
        CFBundleURLTypes:
          - CFBundleURLName: com.zeus.deeplink
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [zeus]
  ZeusTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/ZeusTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Zeus
schemes:
  Zeus:
    build:
      targets:
        Zeus: all
        ZeusTests: [test]
    test:
      targets: [ZeusTests]
