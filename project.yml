name: Zeus
options:
  bundleIdPrefix: com.zeus
  deploymentTarget:
    iOS: "17.0"
targets:
  Zeus:
    type: application
    platform: iOS
    sources: [Sources/ZeusApp]
    entitlements:
      # POINTS AT a tracked, hand-written file — it is deliberately NOT an
      # inline `properties:` block. An inline block would make xcodegen
      # generate the entitlements file too, and the reasoning about what
      # `development` does and does not buy would be destroyed by the next
      # `xcodegen generate` exactly as the Info.plist comment is.
      path: Sources/ZeusApp/Zeus.entitlements
    info:
      # AUTHORITATIVE SOURCE for Sources/ZeusApp/Info.plist. That file is
      # generated whole from the properties below on every `xcodegen
      # generate`; edits made directly to the plist are discarded. Add keys
      # here, never there.
      path: Sources/ZeusApp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Zeus
        # WITHOUT THIS, `onOpenURL` NEVER FIRES. The parser and its tests are
        # pure Swift and pass whether or not the app is registered for the
        # scheme — so a green suite is not evidence the links work. This block
        # is the only thing that makes the OS route `zeus://` here, and it is
        # tracked config, so it cannot drift out with a stale pbxproj.
        CFBundleURLTypes:
          - CFBundleURLName: com.zeus.deeplink
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [zeus]
  ZeusTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/ZeusTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Zeus
schemes:
  Zeus:
    build:
      targets:
        Zeus: all
        ZeusTests: [test]
    test:
      targets: [ZeusTests]
